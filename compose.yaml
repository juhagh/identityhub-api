services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    container_name: identityhub-postgres
    environment:
      POSTGRES_DB: identityhub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - identityhub-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identityhub"]
      interval: 5s
      timeout: 5s
      retries: 5
      
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=identityhub;Username=postgres;Password=postgres
  
volumes:
  identityhub-pgdata: